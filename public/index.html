<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>دفتر الشراكة</title>
  <style>
    :root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#6b7280;--line:#e6e9f0;--primary:#4f46e5;--primary2:#7c3aed;--green:#11875d;--red:#c2410c;--amber:#a16207;--shadow:0 8px 30px rgba(31,41,55,.08)}
    *{box-sizing:border-box} body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)} button,input,select,textarea{font:inherit} .hidden{display:none!important}
    .top{position:sticky;top:0;z-index:10;background:#111827;color:#fff;padding:12px 18px;display:flex;gap:14px;align-items:center;justify-content:space-between}.brand{font-weight:800}.userbox{display:flex;align-items:center;gap:10px}.btn{border:0;border-radius:10px;padding:10px 14px;cursor:pointer}.btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff}.btn.light{background:#eef0f7;color:#20263a}.btn.danger{background:#fee2e2;color:#991b1b}.btn:disabled{opacity:.5;cursor:not-allowed}
    .layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 57px)} .side{background:#fff;border-left:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:7px}.nav{width:100%;background:transparent;border:0;text-align:right;padding:11px 12px;border-radius:9px;cursor:pointer;color:#4b5563}.nav.active,.nav:hover{background:#f0f2ff;color:var(--primary);font-weight:700}.content{padding:22px;max-width:1500px;width:100%;margin:auto}.grid{display:grid;gap:14px}.cards{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}.kpi .label{color:var(--muted);font-size:13px}.kpi .value{font-size:24px;font-weight:800;margin-top:8px}.green{color:var(--green)}.red{color:var(--red)}.amber{color:var(--amber)}.purple{color:var(--primary)}
    .section{margin-top:18px}.section h2{margin:0 0 10px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}.table{width:100%;border-collapse:collapse;min-width:760px;background:#fff}.table th,.table td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}.table th{background:#fafbfe;color:#4b5563;font-size:13px}.pill{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:12px;font-weight:700}.pill.income{background:#dcfce7;color:#166534}.pill.expense{background:#ffedd5;color:#9a3412}.pill.withdrawal{background:#fee2e2;color:#991b1b}.pill.profit{background:#e0e7ff;color:#3730a3}
    .formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field input,.field select,.field textarea{border:1px solid #d7dce7;border-radius:10px;padding:10px;background:#fff}.field textarea{min-height:80px;resize:vertical}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.note{font-size:13px;color:var(--muted)}.alert{padding:12px;border-radius:10px;margin-bottom:12px}.alert.error{background:#fff1f2;color:#9f1239}.alert.success{background:#ecfdf5;color:#047857}
    .login-shell{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 15% 15%,#e0e7ff,transparent 34%),radial-gradient(circle at 85% 80%,#ede9fe,transparent 32%),var(--bg);padding:20px}.login-card{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:0 18px 55px rgba(49,46,129,.12)}.login-card h1{margin-top:0}.hint{background:#f8fafc;border-radius:12px;padding:10px 12px;font-size:13px;color:#475569;line-height:1.8}.modal{position:fixed;inset:0;background:rgba(15,23,42,.46);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.modal.show{display:flex}.modal-card{background:#fff;width:min(760px,100%);max-height:90vh;overflow:auto;border-radius:18px;padding:20px}.close{float:left;border:0;background:#f1f5f9;width:36px;height:36px;border-radius:10px;cursor:pointer}.toast{position:fixed;bottom:18px;left:18px;z-index:100;max-width:min(420px,calc(100% - 36px));padding:12px 14px;background:#111827;color:#fff;border-radius:12px;box-shadow:var(--shadow);display:none}.toast.show{display:block}
    @media(max-width:900px){.layout{grid-template-columns:1fr}.side{flex-direction:row;overflow:auto;border-left:0;border-bottom:1px solid var(--line)}.nav{min-width:max-content}.content{padding:14px}.formgrid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div id="loginView" class="login-shell">
  <form id="loginForm" class="login-card">
    <h1>دفتر الشراكة</h1><p class="note">نظام داخلي لتسجيل الدخل والمصاريف والأرباح والسحوبات.</p>
    <div id="loginError" class="alert error hidden"></div>
    <div class="field"><label>اسم المستخدم</label><input id="loginUsername" required autocomplete="username"></div>
    <div class="field" style="margin-top:10px"><label>كلمة المرور</label><input id="loginPassword" type="password" required autocomplete="current-password"></div>
    <button class="btn primary" style="width:100%;margin-top:16px">دخول</button>
    <div class="hint" style="margin-top:14px"><b>حسابات البداية:</b><br>المدير: admin / admin123<br>عزام: azam / azam123<br>وسيم: waseem / waseem123</div>
  </form>
</div>

<div id="appView" class="hidden">
<header class="top"><div class="brand">دفتر الشراكة</div><div class="userbox"><span id="topUser"></span><button class="btn light" id="logoutBtn">خروج</button></div></header>
<div class="layout"><nav class="side" id="nav"></nav><main class="content"><div id="page"></div></main></div>
</div>
<div id="modal" class="modal"><div class="modal-card"><button class="close" onclick="closeModal()">×</button><div id="modalBody"></div></div></div>
<div id="toast" class="toast"></div>
<script>
const state={user:null, page:'dashboard'};
const $=s=>document.querySelector(s); const fmt=n=>new Intl.NumberFormat('ar-EG',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(n||0));
const today=()=>new Date().toISOString().slice(0,10);
async function api(url,opts={}){const r=await fetch(url,{headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts});let data={};try{data=await r.json()}catch{} if(!r.ok) throw new Error(data.error||'حدث خطأ غير متوقع');return data}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800)}
function closeModal(){$('#modal').classList.remove('show')}
function showModal(html){$('#modalBody').innerHTML=html;$('#modal').classList.add('show')}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
async function boot(){try{const m=await api('/api/me');state.user=m.user;enter()}catch{}}
function enter(){$('#loginView').classList.add('hidden');$('#appView').classList.remove('hidden');$('#topUser').textContent=`${state.user.display_name} — ${state.user.role==='admin'?'مدير':'شريك'}`;buildNav();go('dashboard')}
function buildNav(){const items=[['dashboard','لوحة التحكم'],['partner','حسابي'],['transactions','العمليات'],['report','التقرير الأسبوعي'],['monthly','التقرير الشهري']];if(state.user.role==='admin')items.push(['settings','الإعدادات'],['audit','سجل التدقيق'],['users','المستخدمون']);$('#nav').innerHTML=items.map(([k,v])=>`<button class="nav ${state.page===k?'active':''}" onclick="go('${k}')">${v}</button>`).join('')}
async function go(p){state.page=p;buildNav();const page=$('#page');page.innerHTML='<div class="card">جارٍ التحميل...</div>';try{if(p==='dashboard')await dashboard();else if(p==='partner')await partner();else if(p==='transactions')await transactions();else if(p==='report')await report('weekly');else if(p==='monthly')await report('monthly');else if(p==='settings')await settings();else if(p==='audit')await audit();else if(p==='users')await users()}catch(e){page.innerHTML=`<div class="alert error">${esc(e.message)}</div>`}}
function kpi(label,value,cls=''){return `<div class="card kpi"><div class="label">${label}</div><div class="value ${cls}">${fmt(value)}</div></div>`}
async function dashboard(){const d=await api('/api/dashboard');$('#page').innerHTML=`<h1>لوحة التحكم</h1><p class="note">تفصل هذه اللوحة بين الربح والمصاريف والسحوبات والأرصدة المستحقة.</p><div class="grid cards">${kpi('صافي الربح',d.netProfit,'green')}${kpi('المحتفظ به للمشروع',d.retained_amount,'purple')}${kpi('المتاح للتوزيع',d.distributable_amount,'green')}${kpi('رصيد عزام',d.partners.find(x=>x.partner_key==='azam')?.balance||0,'purple')}${kpi('رصيد وسيم',d.partners.find(x=>x.partner_key==='waseem')?.balance||0,'purple')}${kpi('إجمالي السحوبات',d.withdrawals,'red')}${kpi('إعلانات',d.advertising,'amber')}${kpi('تحويلات',d.transfer,'amber')}${kpi('رسوم تحويل',d.transfer_fee,'amber')}</div><div class="section grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))"><div class="card"><h2>ملخص الربحية</h2><p>الدخل: <b>${fmt(d.income)}</b></p><p>المصاريف التشغيلية: <b class="red">${fmt(d.expenses)}</b></p><p>نسبة الاحتفاظ: <b>${fmt(d.settings.project_retention_pct)}%</b></p><p>نسبة التوزيع: <b>${fmt(d.settings.distribution_pct)}%</b></p></div><div class="card"><h2>قاعدة الحساب</h2><p class="note">صافي الربح = إجمالي الدخل − المصروفات التشغيلية/الإعلانية/التحويلات/رسوم التحويل/المصاريف الأخرى.</p><p class="note">بعد ذلك يتم فصل المبلغ المحتفظ به للمشروع عن المبلغ المخصص للتوزيع، ثم تُضاف حصة كل شريك إلى Ledger الخاص به.</p></div></div>`}
async function partner(){const d=await api('/api/partner/me');const s=d.summary;$('#page').innerHTML=`<h1>حساب ${esc(s.display_name)}</h1><div class="grid cards">${kpi('نسبة الشراكة',s.share_pct+'%','purple')}${kpi('إجمالي الأرباح المخصصة',s.total_allocated,'green')}${kpi('إجمالي السحوبات',s.total_withdrawals,'red')}${kpi('الرصيد المتراكم',s.balance,'purple')}${kpi('أقل سحب',s.min_withdrawal_amount,'amber')}${kpi('أقصى سحب',s.max_withdrawal_amount,'amber')}</div><div class="card section"><h2>السحب</h2><p class="note">النسب التالية تُطبق على الرصيد المتاح للسحب حاليًا. الحد الأدنى ${s.withdrawal_min_pct}% والحد الأقصى ${s.withdrawal_max_pct}%. كما يطبق سقف الفترة ${s.withdrawal_limit_period==='weekly'?'أسبوعيًا':'شهريًا'}.</p><div class="actions"><button class="btn primary" onclick="openWithdrawal()">تسجيل سحب</button></div></div><div class="section card"><h2>سجل الأرباح</h2><div class="table-wrap"><table class="table"><thead><tr><th>التاريخ</th><th>الفترة</th><th>صافي ربح المشروع</th><th>نسبة الشريك</th><th>حصة الشريك</th></tr></thead><tbody>${d.profitRows.map(r=>`<tr><td>${r.end_date}</td><td>${r.start_date} → ${r.end_date}</td><td>${fmt(r.net_profit)}</td><td>${fmt(r.share_pct)}%</td><td>${fmt(r.allocated_amount)}</td></tr>`).join('')||'<tr><td colspan="5">لا توجد توزيعات بعد.</td></tr>'}</tbody></table></div></div><div class="section card"><h2>سجل Ledger</h2><div class="table-wrap"><table class="table"><thead><tr><th>التاريخ</th><th>النوع</th><th>القيمة</th><th>الملاحظة</th><th>الرصيد بعد الحركة</th></tr></thead><tbody>${d.ledger.map(r=>`<tr><td>${r.entry_date}</td><td><span class="pill ${r.entry_type==='withdrawal'?'withdrawal':'profit'}">${r.entry_type==='withdrawal'?'سحب':'تخصيص ربح'}</span></td><td>${r.entry_type==='withdrawal'?'-':''}${fmt(r.amount)}</td><td>${esc(r.note||'')}</td><td><b>${fmt(r.running_balance)}</b></td></tr>`).join('')||'<tr><td colspan="5">لا توجد حركات.</td></tr>'}</tbody></table></div></div><div class="section card"><h2>سجل السحوبات</h2><div class="table-wrap"><table class="table"><thead><tr><th>التاريخ</th><th>المبلغ</th><th>النوع</th><th>الملاحظة</th><th>معرّف العملية</th></tr></thead><tbody>${d.withdrawals.map(r=>`<tr><td>${r.occurred_on}</td><td class="red">${fmt(r.amount)}</td><td>${esc(r.category)}</td><td>${esc(r.note||'')}</td><td>#${r.id}</td></tr>`).join('')||'<tr><td colspan="5">لا توجد سحوبات.</td></tr>'}</tbody></table></div></div>`}
function openWithdrawal(){showModal(`<h2>تسجيل سحب شخصي</h2><p class="note">سيتم التحقق من الرصيد والحد الأدنى والأقصى وسقف السحب للفترة قبل تسجيل العملية.</p><form id="withdrawForm" class="formgrid"><div class="field"><label>التاريخ</label><input name="occurred_on" type="date" value="${today()}" required></div><div class="field"><label>المبلغ</label><input name="amount" type="number" step="0.01" min="0.01" required></div><div class="field"><label>نوع السحب</label><select name="category"><option value="personal">سحب شخصي</option><option value="profit">سحب أرباح</option><option value="other">سحب آخر</option></select></div><div class="field"><label>رقم/معرف العملية</label><input name="reference"></div><div class="field full"><label>ملاحظة</label><textarea name="note"></textarea></div><div class="field full"><button class="btn primary">تأكيد السحب</button></div></form>`);$('#withdrawForm').onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.target));try{await api('/api/withdrawals',{method:'POST',body:JSON.stringify({...b,amount:Number(b.amount)})});closeModal();toast('تم تسجيل السحب.');await partner()}catch(err){toast(err.message)}}}
async function transactions(){const tx=await api('/api/transactions');const admin=state.user.role==='admin';$('#page').innerHTML=`<h1>العمليات</h1>${admin?'<div class="actions"><button class="btn primary" onclick="openIncome()">+ إضافة دخل</button><button class="btn light" onclick="openExpense()">+ إضافة مصروف</button><button class="btn light" onclick="openWithdrawalAdmin()">+ إضافة سحب لشريك</button></div>':''}<div class="section card"><div class="table-wrap"><table class="table"><thead><tr><th>التاريخ</th><th>المبلغ</th><th>النوع</th><th>التصنيف</th><th>الشريك</th><th>الملاحظة</th><th>المعرف</th><th>أضافها</th>${admin?'<th>إجراءات</th>':''}</tr></thead><tbody>${tx.map(r=>`<tr><td>${r.occurred_on}</td><td>${fmt(r.amount)}</td><td><span class="pill ${r.type}">${r.type==='income'?'دخل':r.type==='expense'?'مصروف':'سحب'}</span></td><td>${esc(r.category)}</td><td>${esc(r.partner_name||'—')}</td><td>${esc(r.note||'')}</td><td>${esc(r.reference||('#'+r.id))}</td><td>${esc(r.created_by_name)}</td>${admin?`<td><button class="btn light" onclick="editTx(${r.id},${JSON.stringify(r).replace(/"/g,'&quot;')})">تعديل</button> <button class="btn danger" onclick="deleteTx(${r.id})">حذف</button></td>`:''}</tr>`).join('')||'<tr><td colspan="9">لا توجد عمليات.</td></tr>'}</tbody></table></div></div>`}
function openIncome(){showModal(`<h2>إضافة دخل</h2><form id="incomeForm" class="formgrid"><div class="field"><label>التاريخ</label><input name="occurred_on" type="date" value="${today()}" required></div><div class="field"><label>المبلغ</label><input name="amount" type="number" step="0.01" min="0.01" required></div><div class="field"><label>نوع الدخل</label><input name="category" value="operating_income" required></div><div class="field"><label>رقم العملية</label><input name="reference"></div><div class="field full"><label>ملاحظة</label><textarea name="note"></textarea></div><div class="field full"><button class="btn primary">حفظ</button></div></form>`);$('#incomeForm').onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.target));try{await api('/api/income',{method:'POST',body:JSON.stringify({...b,amount:Number(b.amount)})});closeModal();toast('تمت إضافة الدخل.');await transactions()}catch(err){toast(err.message)}}}
function openExpense(){showModal(`<h2>إضافة مصروف</h2><form id="expenseForm" class="formgrid"><div class="field"><label>التاريخ</label><input name="occurred_on" type="date" value="${today()}" required></div><div class="field"><label>المبلغ</label><input name="amount" type="number" step="0.01" min="0.01" required></div><div class="field"><label>التصنيف</label><select name="category"><option value="advertising">مسحوبات إعلانات</option><option value="transfer">مسحوبات تحويلات</option><option value="transfer_fee">نسب تحويلات</option><option value="other">مصاريف أخرى</option></select></div><div class="field"><label>رقم العملية</label><input name="reference"></div><div class="field full"><label>ملاحظة</label><textarea name="note"></textarea></div><div class="field full"><button class="btn primary">حفظ</button></div></form>`);$('#expenseForm').onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.target));try{await api('/api/expense',{method:'POST',body:JSON.stringify({...b,amount:Number(b.amount)})});closeModal();toast('تمت إضافة المصروف.');await transactions()}catch(err){toast(err.message)}}}
async function openWithdrawalAdmin(){const ps=await api('/api/partners');showModal(`<h2>إضافة سحب لشريك</h2><form id="wa" class="formgrid"><div class="field"><label>الشريك</label><select name="partner_id">${ps.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>التاريخ</label><input name="occurred_on" type="date" value="${today()}" required></div><div class="field"><label>المبلغ</label><input name="amount" type="number" step="0.01" min="0.01" required></div><div class="field"><label>النوع</label><select name="category"><option value="personal">سحب شخصي</option><option value="profit">سحب أرباح</option><option value="other">سحب آخر</option></select></div><div class="field full"><label>ملاحظة</label><textarea name="note"></textarea></div><div class="field full"><button class="btn primary">حفظ</button></div></form>`);$('#wa').onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.target));try{await api('/api/withdrawals',{method:'POST',body:JSON.stringify({...b,partner_id:Number(b.partner_id),amount:Number(b.amount)})});closeModal();toast('تم تسجيل السحب.');await transactions()}catch(err){toast(err.message)}}}
async function report(type){const start=today();const r=await api(`/api/report?type=${type}&start=${start}&end=${start}`);const title=type==='weekly'?'التقرير الأسبوعي':'التقرير الشهري';$('#page').innerHTML=`<h1>${title}</h1><div class="actions"><label>تاريخ مرجعي <input id="reportDate" type="date" value="${start}" class="btn light" style="padding:9px"></label><button class="btn primary" onclick="loadReport('${type}')">تحديث</button><button class="btn light" onclick="customReport()">فترة مخصصة</button></div><div id="reportBox" class="section">${renderReport(r)}</div>`}
function renderReport(r){return `<div class="grid cards">${kpi('إجمالي الدخل',r.income,'green')}${kpi('إجمالي المصروفات',r.expenses,'red')}${kpi('إعلانات',r.advertising,'amber')}${kpi('تحويلات',r.transfer,'amber')}${kpi('رسوم تحويل',r.transfer_fee,'amber')}${kpi('مصروفات أخرى',r.other,'amber')}${kpi('صافي الربح',r.netProfit,'green')}${kpi('المحتفظ به للمشروع',r.retained_amount,'purple')}${kpi('المخصص للتوزيع',r.distributable_amount,'green')}</div><div class="section card"><h2>تفصيل الشركاء</h2><div class="table-wrap"><table class="table"><thead><tr><th>الشريك</th><th>النسبة</th><th>حصة الفترة</th><th>سحوبات الفترة</th><th>الرصيد المتراكم</th></tr></thead><tbody>${r.partners.map(p=>`<tr><td>${esc(p.name)}</td><td>${fmt(p.share_pct)}%</td><td>${fmt(p.period_share)}</td><td class="red">${fmt(p.period_withdrawals)}</td><td class="purple"><b>${fmt(p.accumulated_balance)}</b></td></tr>`).join('')}</tbody></table></div></div><div class="section card"><p><b>الفترة:</b> ${r.start} → ${r.end}</p><p><b>نسبة الاحتفاظ:</b> ${fmt(r.retention_pct)}% &nbsp; <b>نسبة التوزيع:</b> ${fmt(r.distribution_pct)}%</p></div>`}
async function loadReport(type){const d=$('#reportDate').value;const r=await api(`/api/report?type=${type}&start=${d}&end=${d}`);$('#reportBox').innerHTML=renderReport(r)}
async function customReport(){showModal(`<h2>تقرير فترة مخصصة</h2><form id="cr" class="formgrid"><div class="field"><label>من</label><input name="start" type="date" value="${today()}" required></div><div class="field"><label>إلى</label><input name="end" type="date" value="${today()}" required></div><div class="field full"><button class="btn primary">عرض التقرير</button></div></form>`);$('#cr').onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.target));try{const r=await api(`/api/report?type=custom&start=${b.start}&end=${b.end}`);closeModal();$('#reportBox').innerHTML=renderReport(r)}catch(err){toast(err.message)}}}
async function settings(){const s=await api('/api/settings');$('#page').innerHTML=`<h1>الإعدادات</h1><div class="card"><form id="settingsForm" class="formgrid"><div class="field"><label>نسبة عزام %</label><input name="azam_share_pct" type="number" step="0.01" value="${s.azam_share_pct}"></div><div class="field"><label>نسبة وسيم %</label><input name="waseem_share_pct" type="number" step="0.01" value="${s.waseem_share_pct}"></div><div class="field"><label>الاحتفاظ بالمشروع %</label><input name="project_retention_pct" type="number" step="0.01" value="${s.project_retention_pct}"></div><div class="field"><label>التوزيع %</label><input name="distribution_pct" type="number" step="0.01" value="${s.distribution_pct}"></div><div class="field"><label>الحد الأدنى للسحب %</label><input name="withdrawal_min_pct" type="number" step="0.01" value="${s.withdrawal_min_pct}"></div><div class="field"><label>الحد الأقصى للسحب %</label><input name="withdrawal_max_pct" type="number" step="0.01" value="${s.withdrawal_max_pct}"></div><div class="field"><label>حد السحب</label><select name="withdrawal_limit_period"><option value="weekly" ${s.withdrawal_limit_period==='weekly'?'selected':''}>أسبوعي</option><option value="monthly" ${s.withdrawal_limit_period==='monthly'?'selected':''}>شهري</option></select></div><div class="field"><label>بداية الأسبوع</label><select name="accounting_week_start">${['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'].map((x,i)=>`<option value="${i}" ${s.accounting_week_start===i?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>بداية الشهر</label><input name="accounting_month_start" type="number" min="1" max="28" value="${s.accounting_month_start}"></div><div class="field full"><label><input name="partners_can_view_each_other" type="checkbox" ${s.partners_can_view_each_other?'checked':''}> السماح للشركاء برؤية بيانات بعضهما</label></div><div class="field full"><button class="btn primary">حفظ الإعدادات</button></div></form><p class="note">أي تغيير يُحفظ مع تاريخ التغيير ومن قام به، ويؤثر على الفترات اللاحقة. الفترات التاريخية تبقى مرتبطة بإعداداتها التي كانت سارية في نهايتها.</p></div>`;$('#settingsForm').onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.target));b.partners_can_view_each_other=e.target.partners_can_view_each_other.checked;['azam_share_pct','waseem_share_pct','project_retention_pct','distribution_pct','withdrawal_min_pct','withdrawal_max_pct','accounting_week_start','accounting_month_start'].forEach(k=>b[k]=Number(b[k]));try{await api('/api/settings',{method:'PUT',body:JSON.stringify(b)});toast('تم حفظ الإعدادات وإعادة بناء Ledger.');await settings()}catch(err){toast(err.message)}}}
async function audit(){const rows=await api('/api/audit');$('#page').innerHTML=`<h1>سجل التدقيق</h1><div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>التاريخ</th><th>المستخدم</th><th>العملية</th><th>الكيان</th><th>المعرف</th><th>القيمة القديمة</th><th>القيمة الجديدة</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.created_at}</td><td>${esc(r.user_name||'—')}</td><td>${esc(r.action)}</td><td>${esc(r.entity_type)}</td><td>${r.entity_id||'—'}</td><td><pre style="white-space:pre-wrap;max-width:330px">${esc(r.old_value||'')}</pre></td><td><pre style="white-space:pre-wrap;max-width:330px">${esc(r.new_value||'')}</pre></td></tr>`).join('')}</tbody></table></div></div>`}
async function users(){const rows=await api('/api/users');$('#page').innerHTML=`<h1>المستخدمون</h1><div class="actions"><button class="btn primary" onclick="openUser()">+ مستخدم</button></div><div class="section card"><div class="table-wrap"><table class="table"><thead><tr><th>المستخدم</th><th>الاسم</th><th>الدور</th><th>الشريك</th><th>الحالة</th><th>تاريخ الإنشاء</th><th>إجراءات</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.username)}</td><td>${esc(r.display_name)}</td><td>${r.role==='admin'?'مدير':'شريك'}</td><td>${esc(r.partner_key||'—')}</td><td>${r.is_active?'فعال':'موقف'}</td><td>${r.created_at}</td><td><button class="btn light" onclick="toggleUser(${r.id},${r.is_active?'false':'true'})">${r.is_active?'إيقاف':'تفعيل'}</button></td></tr>`).join('')}</tbody></table></div></div>`}
function openUser(){showModal(`<h2>إضافة مستخدم</h2><form id="uf" class="formgrid"><div class="field"><label>اسم المستخدم</label><input name="username" required></div><div class="field"><label>الاسم الظاهر</label><input name="display_name" required></div><div class="field"><label>الدور</label><select name="role"><option value="partner">شريك</option><option value="admin">مدير</option></select></div><div class="field"><label>نوع الشريك</label><select name="partner_key"><option value="azam">عزام</option><option value="waseem">وسيم</option></select></div><div class="field"><label>كلمة المرور</label><input name="password" type="password" required></div><div class="field full"><button class="btn primary">حفظ</button></div></form>`);$('#uf').onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.target));try{await api('/api/users',{method:'POST',body:JSON.stringify(b)});closeModal();toast('تم إنشاء المستخدم.');await users()}catch(err){toast(err.message)}}}

function editTx(id, raw){
  const r=typeof raw==='string'?JSON.parse(raw.replace(/&quot;/g,'"')):raw;
  const isW=r.type==='withdrawal';
  showModal(`<h2>تعديل عملية #${id}</h2><form id="et" class="formgrid"><div class="field"><label>التاريخ</label><input name="occurred_on" type="date" value="${r.occurred_on}" required></div><div class="field"><label>المبلغ</label><input name="amount" type="number" step="0.01" value="${r.amount}" required></div><div class="field"><label>التصنيف</label>${isW?`<select name="category"><option value="personal" ${r.category==='personal'?'selected':''}>سحب شخصي</option><option value="profit" ${r.category==='profit'?'selected':''}>سحب أرباح</option><option value="other" ${r.category==='other'?'selected':''}>سحب آخر</option></select>`:`<input name="category" value="${esc(r.category)}" ${r.type==='expense'?'':'readonly'}>`}</div><div class="field"><label>رقم العملية</label><input name="reference" value="${esc(r.reference||'')}"></div><div class="field full"><label>ملاحظة</label><textarea name="note">${esc(r.note||'')}</textarea></div><div class="field full"><button class="btn primary">حفظ التعديل</button></div></form>`);
  $('#et').onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.target));try{await api('/api/transactions/'+id,{method:'PUT',body:JSON.stringify({...b,amount:Number(b.amount),type:r.type})});closeModal();toast('تم تعديل العملية وإعادة بناء Ledger.');await transactions()}catch(err){toast(err.message)}};
}
async function toggleUser(id, active){try{await api('/api/users/'+id,{method:'PATCH',body:JSON.stringify({is_active:active})});toast(active?'تم تفعيل المستخدم.':'تم إيقاف المستخدم.');await users()}catch(e){toast(e.message)}}
async function deleteTx(id){if(!confirm('حذف العملية سيضعها كملغاة ولن يحذفها نهائيًا، وسيُعاد احتساب Ledger. هل تريد المتابعة؟'))return;try{await api('/api/transactions/'+id,{method:'DELETE'});toast('تم إلغاء العملية وإعادة الاحتساب.');await transactions()}catch(e){toast(e.message)}}
$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginError').classList.add('hidden');try{const m=await api('/api/login',{method:'POST',body:JSON.stringify({username:$('#loginUsername').value,password:$('#loginPassword').value})});state.user=m.user;enter()}catch(err){$('#loginError').textContent=err.message;$('#loginError').classList.remove('hidden')}};
$('#logoutBtn').onclick=async()=>{await api('/api/logout',{method:'POST'});location.reload()};
boot();
</script>
</body></html>
